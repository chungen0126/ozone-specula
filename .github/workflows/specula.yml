name: Specula run

# Runs one Specula target (TLA+ spec generation, model checking, trace
# validation and bug confirmation) against an Ozone checkout.
# Start it from the Actions tab or with `gh workflow run`; see README.md.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target name, e.g. om-key-lifecycle
        required: true
        type: string
      guidance:
        description: Guidance file in this repository, e.g. guidance/om-key-lifecycle.md
        required: true
        type: string
      ozone_repo:
        description: Ozone repository to check out
        type: string
        default: chungen0126/ozone
      ozone_ref:
        description: Branch, tag or commit of that repository
        type: string
        default: master
      runner:
        description: Runner label (ubuntu-latest has 4 CPU, 16 GB RAM and a 6 hour job limit)
        type: string
        default: ubuntu-latest
      model:
        description: Claude model passed to Specula
        type: string
        default: claude-opus-5-5[1m]
      effort:
        description: Agent reasoning effort
        type: choice
        options: [medium, high, low]
        default: medium
      tlc_memory_limit:
        description: TLC heap + direct memory budget for the whole run
        type: string
        default: 10G
      tlc_worker_limit:
        description: TLC worker threads for the whole run
        type: string
        default: '3'
      max_parallel:
        description: Concurrent agents (confirmation runs several Reproducers at once)
        type: string
        default: '1'
      reviews_and_debate:
        description: Add --enable-reviews and --confirm-debate (more tokens, fewer false positives)
        type: boolean
        default: true
      prebuild:
        description: Build Ozone once before Specula starts, to fill the Maven cache
        type: boolean
        default: true
      specula_ref:
        description: Specula commit or tag
        type: string
        default: e616bdae7b4eea622f8248ead79b9f8937c29fe7
      time_limit_minutes:
        description: Stop Specula after this many minutes so the results can still be uploaded
        type: number
        default: 320

permissions:
  contents: read

jobs:
  specula:
    runs-on: ${{ inputs.runner }}
    # GitHub-hosted jobs are killed at 360 minutes.
    timeout-minutes: ${{ inputs.runner == 'ubuntu-latest' && 355 || 4320 }}
    env:
      RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      SPECULA_HOME: ${{ github.workspace }}/specula
      OZONE_DIR: ${{ github.workspace }}/ozone
      CONFIG_DIR: ${{ github.workspace }}/config
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null || true
          df -h "$GITHUB_WORKSPACE"
          free -g
          nproc

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: config
          persist-credentials: false

      - name: Check out Ozone
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ozone_repo }}
          ref: ${{ inputs.ozone_ref }}
          path: ozone
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Specula
        uses: actions/checkout@v4
        with:
          repository: specula-org/Specula
          ref: ${{ inputs.specula_ref }}
          path: specula
          persist-credentials: false

      - name: Check inputs and credentials
        env:
          GUIDANCE: ${{ inputs.guidance }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" && -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::Set the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret."
            exit 1
          fi
          if [[ ! -f "$CONFIG_DIR/$GUIDANCE" ]]; then
            echo "::error::Guidance file not found in this repository: $GUIDANCE"
            exit 1
          fi
          echo "Ozone commit: $(git -C "$OZONE_DIR" rev-parse HEAD)"
          echo "Specula commit: $(git -C "$SPECULA_HOME" rev-parse HEAD)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ozone/**/pom.xml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code and Specula
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          cd "$SPECULA_HOME"
          uv tool install -e .
          tool_bin="$(uv tool dir --bin)"
          echo "$tool_bin" >> "$GITHUB_PATH"
          # specula setup is interactive: install for Claude Code, globally.
          printf 'y\nglobal\n' | "$tool_bin/specula" setup

      - name: Build Ozone
        if: inputs.prebuild
        working-directory: ozone
        run: mvn -B -q install -DskipTests -DskipShade -DskipRecon

      - name: Run Specula
        working-directory: specula
        env:
          TARGET: ${{ inputs.target }}
          GUIDANCE: ${{ inputs.guidance }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          TLC_MEMORY_LIMIT: ${{ inputs.tlc_memory_limit }}
          TLC_WORKER_LIMIT: ${{ inputs.tlc_worker_limit }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          REVIEWS_AND_DEBATE: ${{ inputs.reviews_and_debate }}
          TIME_LIMIT_MINUTES: ${{ inputs.time_limit_minutes }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Used by the agent for GitHub issue and history research.
          GH_TOKEN: ${{ github.token }}
          TLC_STATE_DIR: ${{ runner.temp }}/tlc-states
        run: |
          [[ -n "$ANTHROPIC_API_KEY" ]] || unset ANTHROPIC_API_KEY
          [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]] || unset CLAUDE_CODE_OAUTH_TOKEN
          mkdir -p "$TLC_STATE_DIR"
          args=(
            --agent=claude-code --model="$MODEL" --effort="$EFFORT"
            --artifact="$OZONE_DIR" --guidance="$CONFIG_DIR/$GUIDANCE"
            --keep-original --run-id="$RUN_ID" --max-parallel="$MAX_PARALLEL"
            --tlc-memory-limit="$TLC_MEMORY_LIMIT" --tlc-worker-limit="$TLC_WORKER_LIMIT"
          )
          if [[ "$REVIEWS_AND_DEBATE" == true ]]; then
            args+=(--enable-reviews --confirm-debate)
          fi
          set +e
          timeout --signal=INT --kill-after=5m "${TIME_LIMIT_MINUTES}m" \
            specula run "${args[@]}" "$TARGET|apache/ozone|Java|Use the target-specific guidance"
          rc=$?
          set -e
          if [[ $rc -eq 124 ]]; then
            echo "::warning::Specula stopped at the ${TIME_LIMIT_MINUTES} minute limit; results are partial."
          fi
          exit $rc

      - name: Collect results
        if: always()
        env:
          TARGET: ${{ inputs.target }}
          OZONE_REPO: ${{ inputs.ozone_repo }}
          OUT_DIR: ${{ runner.temp }}/specula-out
        run: |
          run_dir="$SPECULA_HOME/runs/$RUN_ID"
          if [[ ! -d "$run_dir" ]]; then
            echo "No Specula run directory at $run_dir"
            exit 0
          fi
          mkdir -p "$OUT_DIR"
          # Leave out the private source copy; changes.patch carries the source changes.
          rsync -a --exclude='/*/source/' --exclude='states/' "$run_dir/" "$OUT_DIR/"
          du -sh "$OUT_DIR"
          {
            echo "## Specula: $TARGET"
            echo
            echo "Ozone: \`$OZONE_REPO@$(git -C "$OZONE_DIR" rev-parse --short HEAD)\`"
            echo
            if [[ -f "$run_dir/pipeline-summary.md" ]]; then
              cat "$run_dir/pipeline-summary.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specula-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/specula-out
          if-no-files-found: warn
          retention-days: 30
